{% extends "base.html" %}
{% block title %}Choose a username{% endblock %}
{% block content %}
  <h1>Choose a username</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/choose-username">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required
           minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username">

    <button type="submit">Save username</button>
  </form>
  <p class="hint">3-20 letters, numbers, or underscores. This is what you will log in with.</p>
{% endblock %}
